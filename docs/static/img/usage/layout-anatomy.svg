<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of the basic layout example</title>
  <desc id="desc">A layout labelled Service status contains one row. Its wide item wraps an API section and its narrow item wraps a Healthy section. A separate fallback section reads API: Healthy. Nested boxes indicate object structure, not rendered grid lines.</desc>
  <rect width="800" height="350" rx="12" fill="#f6f8fb"/>
  <g font-family="system-ui, sans-serif" fill="#172b4d">
    <rect x="20" y="20" width="760" height="234" rx="10" fill="#fff" stroke="#504a91" stroke-width="2"/>
    <text x="40" y="49" font-size="19" font-weight="700">Layout block</text>
    <text x="40" y="78" font-size="16">label: Service status · visible</text>
    <rect x="40" y="95" width="720" height="139" rx="8" fill="#f3f2fa" stroke="#504a91" stroke-dasharray="5 4"/>
    <text x="56" y="122" font-size="17" font-weight="600">Row · items in source order</text>
    <rect x="56" y="137" width="504" height="80" rx="6" fill="#e8f4f4" stroke="#26797d"/>
    <text x="72" y="164" font-size="16" font-weight="600">Item · wide (weight 3)</text>
    <text x="72" y="195" font-size="18">Section block: API</text>
    <rect x="576" y="137" width="168" height="80" rx="6" fill="#e8f4f4" stroke="#26797d"/>
    <text x="588" y="161" font-size="15" font-weight="600">Item · narrow (1)</text>
    <text x="588" y="184" font-size="14">Section block:</text>
    <text x="588" y="205" font-size="18">Healthy</text>
    <path d="M40 254v27h16" fill="none" stroke="#504a91" stroke-width="2"/>
    <rect x="56" y="267" width="704" height="62" rx="8" fill="#fff" stroke="#504a91"/>
    <text x="72" y="292" font-size="16" font-weight="600">Fallback · replaces the grid on older clients</text>
    <text x="72" y="315" font-size="17">Section block: API: Healthy</text>
  </g>
</svg>
