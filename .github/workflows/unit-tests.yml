name: Python

on:
  push:
    branches: [master]
    paths:
      - "python/**"
      - "spec/**"
      - "docs/examples/python/**"
      - "docs/examples/section_hello.json"
      - ".github/workflows/unit-tests.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Compare changed files against this workflow's scope
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename') || files=""
          if [ -z "$files" ]; then
            # Fail open: if the file list cannot be read, run the real checks.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(python/|spec/|docs/examples/python/|docs/examples/section_hello\.json$|\.github/workflows/unit-tests\.yml$)' <<<"$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: changes
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        if: needs.changes.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: uv sync --frozen --group dev

      - name: Run unit, conformance, and docs-example tests
        if: needs.changes.outputs.relevant == 'true'
        run: uv run --frozen pytest test/unit test/conformance test/docs
