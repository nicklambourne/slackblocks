name: Coordinated Release
run-name: Coordinated release ${{ inputs.version || github.ref_name }}${{ inputs.resume && ' (resume)' || '' }}

on:
  pull_request:
    paths:
      - ".github/workflows/coordinated-release.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-npm.yml"
      - ".github/workflows/publish-go.yml"
      - ".github/workflows/publish-java.yml"
      - ".github/workflows/publish-nuget.yml"
      - ".github/workflows/publish-rubygems.yml"
      - "python/pyproject.toml"
      - "python/uv.lock"
      - "go/go.mod"
      - "typescript/package.json"
      - "python/CHANGELOG.md"
      - "typescript/CHANGELOG.md"
      - "go/CHANGELOG.md"
      - "java/pom.xml"
      - "java/src/main/java/io/github/nicklambourne/slackblocks/Slackblocks.java"
      - "java/CHANGELOG.md"
      - "csharp/src/Slackblocks/Slackblocks.csproj"
      - "csharp/src/Slackblocks/SlackblocksInfo.cs"
      - "csharp/CHANGELOG.md"
      - "ruby/lib/slackblocks/version.rb"
      - "ruby/CHANGELOG.md"
      - "ruby/Gemfile.lock"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/CHANGELOG.md"
      - ".github/workflows/publish-crates.yml"
      - ".github/scripts/**"
      - ".github/release-publishers.json"
      - ".github/workflows/publish-packagist.yml"
      - "php/**"
      - "elixir/**"
      - "haskell/**"
      - ".github/workflows/publish-hackage.yml"
      - "docs/examples/multiselect-compat/rust/Cargo.lock"
      - ".github/workflows/publish-hex.yml"
      - "composer.json"
      - "rust/integrations/Cargo.lock"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string
      resume:
        description: Observe an existing tagged release without repeating successful uploads
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: coordinated-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate coordinated release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: tooling
          persist-credentials: false

      - name: Check out immutable release source on resume
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ inputs.resume && format('refs/tags/python/v{0}', inputs.version) || github.sha }}

      - name: Record release source
        id: source
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Python for shared release guards
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Test release preflight and publisher wiring without credentials
        run: python -m unittest discover -s tooling/.github/scripts -p 'test_*.py' -v

      - name: Validate all ten languages and release activation
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RESUME: ${{ inputs.resume }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          flags=()
          if [ "$RESUME" = true ]; then flags+=(--resume); fi
          python tooling/.github/scripts/verify-release.py coordinator --source-root source "${flags[@]}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$RESUME" != true ]; then
            python tooling/.github/scripts/release_coordinator.py --check-start --repo "$GH_REPO" --source "$SOURCE_SHA" --version "$REQUESTED_VERSION"
          fi

  php-readiness:
    name: Verify PHP registry and monorepo readiness before tags
    if: github.event_name == 'workflow_dispatch' && !inputs.resume
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: packagist
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify registration and dry-run the monorepo Composer tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python3 php/bin/release.py readiness

  hex-readiness:
    name: Verify Hex readiness before tags
    if: github.event_name == 'workflow_dispatch' && !inputs.resume
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: hex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.16.3"
          otp-version: "26.2"
          version-type: strict
      - name: Install pinned Hex and locked dependencies
        working-directory: elixir
        run: |
          mix local.hex 2.5.1 --force
          mix deps.get --check-locked
      - name: Check account permissions, package identity and authenticated dry run
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: python3 elixir/tools/release.py readiness

  hackage-readiness:
    name: Verify Hackage account and ownership before tags
    if: github.event_name == 'workflow_dispatch' && !inputs.resume
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: hackage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate owner and check uploader and package permissions without writes
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: python3 haskell/bin/release.py readiness

  create-tags:
    name: Create coordinated tags
    if: always() && github.event_name == 'workflow_dispatch' && needs.validate.result == 'success' && (inputs.resume || (needs.php-readiness.result == 'success' && needs.hex-readiness.result == 'success' && needs.hackage-readiness.result == 'success'))
    needs: [validate, php-readiness, hex-readiness, hackage-readiness]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.source }}

      - name: Create or verify release tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source }}
        run: |
          set -euo pipefail

          tags=("python/v$VERSION" "ts/v$VERSION" "go/v$VERSION" "java/v$VERSION" "csharp/v$VERSION" "ruby/v$VERSION" "rust/v$VERSION" "php/v$VERSION" "elixir/v$VERSION" "haskell/v$VERSION")
          existing=0

          for tag in "${tags[@]}"; do
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              existing=$((existing + 1))
              target=$(git rev-list -n 1 "$tag")
              if [ "$target" != "$SOURCE_SHA" ]; then
                echo "::error::Existing tag '$tag' points to $target instead of $SOURCE_SHA."
                exit 1
              fi
            fi
          done

          if [ "$existing" -eq "${#tags[@]}" ]; then
            echo "All coordinated tags already point to $SOURCE_SHA; reusing them."
            exit 0
          fi
          if [ "$existing" -ne 0 ]; then
            echo "::error::Only $existing of the ${#tags[@]} release tags already exist. Resolve the partial release before retrying."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "python/v$VERSION" --message "slackblocks $VERSION (Python)"
          git tag --annotate "ts/v$VERSION" --message "@nicklambourne/slackblocks $VERSION (TypeScript)"
          git tag --annotate "go/v$VERSION" --message "slackblocks $VERSION (Go)"
          git tag --annotate "java/v$VERSION" --message "slackblocks $VERSION (Java)"
          git tag --annotate "csharp/v$VERSION" --message "Slackblocks $VERSION (C#)"
          git tag --annotate "ruby/v$VERSION" --message "slackblocks $VERSION (Ruby)"
          git tag --annotate "rust/v$VERSION" --message "slackblocks $VERSION (Rust)"
          git tag --annotate "php/v$VERSION" --message "slackblocks $VERSION (PHP)"
          git tag --annotate "elixir/v$VERSION" --message "slackblocks $VERSION (Elixir)"
          git tag --annotate "haskell/v$VERSION" --message "slackblocks $VERSION (Haskell)"
          git push --atomic origin "${tags[@]}"

  publish:
    name: Publish ${{ matrix.language }}
    if: always() && github.event_name == 'workflow_dispatch' && needs.validate.result == 'success' && needs.create-tags.result == 'success'
    needs:
      - validate
      - create-tags
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            workflow: publish.yml
            tag_prefix: python/v
          - language: typescript
            workflow: publish-npm.yml
            tag_prefix: ts/v
          - language: go
            workflow: publish-go.yml
            tag_prefix: go/v
          - language: java
            workflow: publish-java.yml
            tag_prefix: java/v
          - language: csharp
            workflow: publish-nuget.yml
            tag_prefix: csharp/v
          - language: ruby
            workflow: publish-rubygems.yml
            tag_prefix: ruby/v
          - language: rust
            workflow: publish-crates.yml
            tag_prefix: rust/v
          - language: php
            workflow: publish-packagist.yml
            tag_prefix: php/v
          - language: haskell
            workflow: publish-hackage.yml
            tag_prefix: haskell/v
          - language: elixir
            workflow: publish-hex.yml
            tag_prefix: elixir/v
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Observe or safely resume the exact publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LANGUAGE: ${{ matrix.language }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source }}
          RESUME: ${{ inputs.resume }}
        run: |
          flags=()
          if [ "$RESUME" = true ]; then flags+=(--resume); fi
          python3 .github/scripts/release_coordinator.py --repo "$GH_REPO" --source "$SOURCE_SHA" \
            --version "$VERSION" --language "$LANGUAGE" --directory "$RUNNER_TEMP/publisher-record" "${flags[@]}"
      - name: Preserve publisher identity, attempts, jobs and artifact digests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publisher-record-${{ matrix.language }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-record/
          if-no-files-found: error

  public-verification:
    name: Verify public packages across all ten languages
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, publish]
    uses: ./.github/workflows/verify-public-release.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      source: ${{ needs.validate.outputs.source }}

  complete:
    name: Record coordinated release completion
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [validate, publish, public-verification]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require publishers and public verification to finish successfully
        env:
          PUBLISHERS: ${{ needs.publish.result }}
          PUBLIC: ${{ needs.public-verification.result }}
        run: test "$PUBLISHERS" = success && test "$PUBLIC" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: publisher-record-*-${{ github.run_attempt }}
          path: evidence/publishers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: public-release-consumer-*-${{ github.run_attempt }}
          path: evidence/consumers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: public-release-identity-${{ github.run_attempt }}
          path: evidence/identity
      - name: Reconcile immutable source, publisher runs and all ten consumers
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE: ${{ needs.validate.outputs.source }}
        run: |
          python3 .github/scripts/release_evidence.py --complete --version "$VERSION" --source "$SOURCE" --directory evidence
          echo "Coordinated release $VERSION verified across all ten public packages." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-completion-${{ github.run_attempt }}
          path: evidence/release-completion.json
          if-no-files-found: error
