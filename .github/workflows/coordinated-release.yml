name: Coordinated Release

on:
  pull_request:
    paths:
      - ".github/workflows/coordinated-release.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-npm.yml"
      - ".github/workflows/publish-go.yml"
      - ".github/workflows/publish-java.yml"
      - ".github/workflows/publish-nuget.yml"
      - ".github/workflows/publish-rubygems.yml"
      - "python/pyproject.toml"
      - "python/uv.lock"
      - "go/go.mod"
      - "typescript/package.json"
      - "python/CHANGELOG.md"
      - "typescript/CHANGELOG.md"
      - "go/CHANGELOG.md"
      - "java/pom.xml"
      - "java/src/main/java/io/github/nicklambourne/slackblocks/Slackblocks.java"
      - "java/CHANGELOG.md"
      - "csharp/src/Slackblocks/Slackblocks.csproj"
      - "csharp/src/Slackblocks/SlackblocksInfo.cs"
      - "csharp/CHANGELOG.md"
      - "ruby/lib/slackblocks/version.rb"
      - "ruby/CHANGELOG.md"
      - "ruby/Gemfile.lock"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/CHANGELOG.md"
      - ".github/workflows/publish-crates.yml"
      - ".github/scripts/**"
      - ".github/workflows/publish-packagist.yml"
      - "php/**"
      - "rust/integrations/Cargo.lock"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coordinated-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate coordinated release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Python for shared release guards
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test release preflight and publisher wiring without credentials
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate all eight packages and release activation
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python .github/scripts/verify-release.py coordinator

  php-readiness:
    name: Verify PHP registry and repository readiness before tags
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: packagist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify registration and dry-run the scoped distribution push
        env:
          PHP_DIST_DEPLOY_KEY: ${{ secrets.PHP_DIST_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/php-publish-ssh.sh readiness

  create-tags:
    name: Create coordinated tags
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, php-readiness]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create or verify release tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          tags=("python/v$VERSION" "ts/v$VERSION" "go/v$VERSION" "java/v$VERSION" "csharp/v$VERSION" "ruby/v$VERSION" "rust/v$VERSION" "php/v$VERSION")
          existing=0

          for tag in "${tags[@]}"; do
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              existing=$((existing + 1))
              target=$(git rev-list -n 1 "$tag")
              if [ "$target" != "$GITHUB_SHA" ]; then
                echo "::error::Existing tag '$tag' points to $target instead of $GITHUB_SHA."
                exit 1
              fi
            fi
          done

          if [ "$existing" -eq "${#tags[@]}" ]; then
            echo "All coordinated tags already point to $GITHUB_SHA; reusing them."
            exit 0
          fi
          if [ "$existing" -ne 0 ]; then
            echo "::error::Only $existing of the ${#tags[@]} release tags already exist. Resolve the partial release before retrying."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "python/v$VERSION" --message "slackblocks $VERSION (Python)"
          git tag --annotate "ts/v$VERSION" --message "@nicklambourne/slackblocks $VERSION (TypeScript)"
          git tag --annotate "go/v$VERSION" --message "slackblocks $VERSION (Go)"
          git tag --annotate "java/v$VERSION" --message "slackblocks $VERSION (Java)"
          git tag --annotate "csharp/v$VERSION" --message "Slackblocks $VERSION (C#)"
          git tag --annotate "ruby/v$VERSION" --message "slackblocks $VERSION (Ruby)"
          git tag --annotate "rust/v$VERSION" --message "slackblocks $VERSION (Rust)"
          git tag --annotate "php/v$VERSION" --message "slackblocks $VERSION (PHP)"
          git push --atomic origin "${tags[@]}"

  publish:
    name: Publish ${{ matrix.language }}
    if: github.event_name == 'workflow_dispatch'
    needs:
      - validate
      - create-tags
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Python
            workflow: publish.yml
            tag_prefix: python/v
          - language: TypeScript
            workflow: publish-npm.yml
            tag_prefix: ts/v
          - language: Go
            workflow: publish-go.yml
            tag_prefix: go/v
          - language: Java
            workflow: publish-java.yml
            tag_prefix: java/v
          - language: C#
            workflow: publish-nuget.yml
            tag_prefix: csharp/v
          - language: Ruby
            workflow: publish-rubygems.yml
            tag_prefix: ruby/v
          - language: Rust
            workflow: publish-crates.yml
            tag_prefix: rust/v
          - language: PHP
            workflow: publish-packagist.yml
            tag_prefix: php/v
    steps:
      - name: Dispatch and monitor publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_WORKFLOW: ${{ matrix.workflow }}
          RELEASE_TAG: ${{ format('{0}{1}', matrix.tag_prefix, needs.validate.outputs.version) }}
        run: |
          set -euo pipefail

          previous_run=$(gh run list --workflow "$PUBLISH_WORKFLOW" --event workflow_dispatch --branch "$RELEASE_TAG" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          gh workflow run "$PUBLISH_WORKFLOW" --ref "$RELEASE_TAG"

          run_id=""
          for _ in {1..12}; do
            run_id=$(gh run list --workflow "$PUBLISH_WORKFLOW" --event workflow_dispatch --branch "$RELEASE_TAG" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ] && [ "$run_id" != "$previous_run" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ] || [ "$run_id" = "$previous_run" ]; then
            echo "::error::Could not find the dispatched $PUBLISH_WORKFLOW run for $RELEASE_TAG."
            exit 1
          fi

          run_url=$(gh run view "$run_id" --json url --jq .url)
          echo "Monitoring $run_url"
          echo "- [${RELEASE_TAG} publisher](${run_url})" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --exit-status
