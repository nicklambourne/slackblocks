name: Haskell

on:
  push:
    branches: [master]
    paths: ["haskell/**", "spec/**", "docs/**", "README.md", ".github/workflows/haskell.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haskell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant Haskell changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check workflow scope
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[] | .filename, (.previous_filename // empty)') || files=""
          if [ -z "$files" ] || grep -qE '^(haskell/|spec/|docs/|README\.md$|\.github/workflows/haskell\.yml$)' <<<"$files"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    name: Haskell tests (${{ matrix.os }}, GHC ${{ matrix.ghc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ghc: ["9.6.7", "9.14.1"]
    defaults:
      run:
        shell: bash
        working-directory: haskell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.relevant == 'true'
      - name: Align macOS SDK and linker
        if: needs.changes.outputs.relevant == 'true' && runner.os == 'macOS'
        run: |
          # GHC's system libraries use the Command Line Tools SDK. Select its
          # matching linker (runner-images#14940), keeping both compiler lanes.
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          xcode-select --print-path
          xcrun clang --version
          xcrun --find ld
      - name: Install Haskell
        if: needs.changes.outputs.relevant == 'true'
        uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.16.1.0"
      - name: Install Python for package checks
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Resolve dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: cabal update
      - name: Check native API and package
        if: needs.changes.outputs.relevant == 'true'
        run: python bin/check --ci-native

  quality:
    needs: changes
    name: Haskell quality and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: haskell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.relevant == 'true'
      - name: Install Haskell
        if: needs.changes.outputs.relevant == 'true'
        uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.16.1.0"
      - name: Install Python
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned source tools
        if: needs.changes.outputs.relevant == 'true'
        run: |
          cabal update
          # Independent plans: these tools intentionally use different GHC
          # parser libraries. Neither belongs in the consumer dependency graph.
          cabal install ormolu-0.7.7.0 --ignore-project --jobs=2 --installdir="$RUNNER_TEMP/haskell-tools"
          cabal install hlint-3.8 --ignore-project --jobs=2 --installdir="$RUNNER_TEMP/haskell-tools"
          echo "$RUNNER_TEMP/haskell-tools" >> "$GITHUB_PATH"
      - name: Check source, compiled API and handwritten coverage
        if: needs.changes.outputs.relevant == 'true'
        run: |
          export SLACKBLOCKS_HASKELL_BUILD="$RUNNER_TEMP/haskell-quality-build"
          export SLACKBLOCKS_HASKELL_COVERAGE="$RUNNER_TEMP/haskell-coverage"
          cabal build lib:slackblocks --builddir="$SLACKBLOCKS_HASKELL_BUILD"
          python bin/quality

  dependencies:
    needs: changes
    name: Haskell dependencies (${{ matrix.ghc }}, ${{ matrix.profile }}, ${{ matrix.keymap }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ghc: "9.6.7", profile: locked, keymap: ordered}
          - {ghc: "9.6.7", profile: lower, keymap: ordered}
          - {ghc: "9.6.7", profile: latest, keymap: unordered}
          - {ghc: "9.14.1", profile: locked, keymap: ordered}
          - {ghc: "9.14.1", profile: latest, keymap: unordered}
    defaults:
      run:
        shell: bash
        working-directory: haskell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.relevant == 'true'
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        if: needs.changes.outputs.relevant == 'true'
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.16.1.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.relevant == 'true'
        with:
          python-version: "3.13"
      - name: Independently resolve and execute every suite
        if: needs.changes.outputs.relevant == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
          KEYMAP: ${{ matrix.keymap }}
        run: |
          cabal update
          args=()
          if [ "$KEYMAP" = unordered ]; then args+=(--unordered-keymap); fi
          python bin/dependency-check "$PROFILE" "${args[@]}"

  compatibility:
    needs: changes
    name: Haskell compiler (GHC ${{ matrix.ghc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.8.4", "9.10.3", "9.12.4"]
    defaults:
      run:
        shell: bash
        working-directory: haskell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.relevant == 'true'
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        if: needs.changes.outputs.relevant == 'true'
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.16.1.0"
      - name: Execute every native suite on intermediate supported compilers
        if: needs.changes.outputs.relevant == 'true'
        run: |
          cabal update
          cabal test all --jobs=2 --test-show-details=direct

  sending:
    needs: changes
    name: Haskell HTTP (GHC ${{ matrix.ghc }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ghc: "9.6.7", profile: locked}
          - {ghc: "9.6.7", profile: lower}
          - {ghc: "9.6.7", profile: latest}
          - {ghc: "9.14.1", profile: latest}
    defaults:
      run:
        shell: bash
        working-directory: haskell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.relevant == 'true'
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        if: needs.changes.outputs.relevant == 'true'
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.16.1.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.relevant == 'true'
        with:
          python-version: "3.13"
      - name: Resolve and test actual HTTP transport
        if: needs.changes.outputs.relevant == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          cabal update
          python bin/http-check --profile "$PROFILE"

  native:
    needs: [changes, test, quality, dependencies, compatibility, sending]
    if: always()
    name: Haskell native checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every native and quality lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          SENDING_RESULT: ${{ needs.sending.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$DEPENDENCIES_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$SENDING_RESULT" = success
