# Measurement only; never merge or dispatch a publisher.
name: Documentation Go cache controlled comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: fc44939dffecb7437e41f670e2f9a726de0ed0ac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Restore first-cold candidate Go cache
        id: first-cold-cache
        if: matrix.pair == 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/docs-go-cache-first/cache
          key: docs-go-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-v1
      - name: Measure first-cold documentation Go commands
        env:
          CACHE_HIT: ${{ steps.first-cold-cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/docs-go-cache.py --source source --root "$RUNNER_TEMP/docs-go-cache-first" --output evidence/first-cold --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'candidate' || 'baseline' }}" --condition cold
      - name: Save first candidate Go cache
        if: matrix.pair == 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/docs-go-cache-first/cache
          key: docs-go-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-v1
      - name: Discard only this sample's private Go cache
        if: matrix.pair == 2
        run: rm -rf "$RUNNER_TEMP/docs-go-cache-first/cache"
      - name: Restore first-warm candidate Go cache
        id: first-warm-cache
        if: matrix.pair == 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/docs-go-cache-first/cache
          key: docs-go-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-v1
      - name: Measure first-warm documentation Go commands
        env:
          CACHE_HIT: ${{ steps.first-warm-cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/docs-go-cache.py --source source --root "$RUNNER_TEMP/docs-go-cache-first" --output evidence/first-warm --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'candidate' || 'baseline' }}" --condition warm
      - name: Preserve first successes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-go-cache-${{ matrix.pair }}-first
          path: evidence/first-*
          if-no-files-found: warn
      - name: Restore second-cold candidate Go cache
        id: second-cold-cache
        if: matrix.pair != 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/docs-go-cache-second/cache
          key: docs-go-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-v1
      - name: Measure second-cold documentation Go commands
        env:
          CACHE_HIT: ${{ steps.second-cold-cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/docs-go-cache.py --source source --root "$RUNNER_TEMP/docs-go-cache-second" --output evidence/second-cold --pair "${{ matrix.pair }}" --variant "${{ matrix.pair != 2 && 'candidate' || 'baseline' }}" --condition cold
      - name: Save second candidate Go cache
        if: matrix.pair != 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/docs-go-cache-second/cache
          key: docs-go-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-v1
      - name: Discard only this sample's private Go cache
        if: matrix.pair != 2
        run: rm -rf "$RUNNER_TEMP/docs-go-cache-second/cache"
      - name: Restore second-warm candidate Go cache
        id: second-warm-cache
        if: matrix.pair != 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/docs-go-cache-second/cache
          key: docs-go-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-v1
      - name: Measure second-warm documentation Go commands
        env:
          CACHE_HIT: ${{ steps.second-warm-cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/docs-go-cache.py --source source --root "$RUNNER_TEMP/docs-go-cache-second" --output evidence/second-warm --pair "${{ matrix.pair }}" --variant "${{ matrix.pair != 2 && 'candidate' || 'baseline' }}" --condition warm
      - name: Preserve second successes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-go-cache-${{ matrix.pair }}-second
          path: evidence/second-*
          if-no-files-found: warn
