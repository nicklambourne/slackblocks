name: Go

on:
  push:
    branches: [master]
    paths:
      - "go/**"
      - "spec/**"
      - "docs/examples/go/**"
      - "docs/examples/section_hello.json"
      - "docs/examples/response_url_payloads.json"
      - "docs/docs/usage/sending_messages.mdx"
      - "docs/docs/usage/using_blocks.mdx"
      - ".github/scripts/extract-go-release-notes.awk"
      - ".github/workflows/go.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Compare changed files against this workflow's scope
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[] | .filename, (.previous_filename // empty)') || files=""
          if [ -z "$files" ]; then
            # Fail open: if the file list cannot be read, run the real checks.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(go/|spec/|docs/examples/go/|docs/examples/(section_hello|response_url_payloads)\.json$|docs/docs/usage/(using_blocks|sending_messages)\.mdx$|\.github/scripts/extract-go-release-notes\.awk$|\.github/workflows/go\.yml$)' <<<"$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out repository
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Install Go ${{ matrix.go-version }}
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Identify exact Go cache inputs
        if: needs.changes.outputs.relevant == 'true'
        id: go-cache
        run: |
          identity=$(go env -json GOVERSION GOOS GOARCH GOAMD64 GOARM GOEXPERIMENT CGO_ENABLED | sha256sum | cut -d ' ' -f 1)
          {
            echo "identity=$identity"
            echo "modules=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore exact Go dependency and build cache
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          # The workflow hash includes analyzer compiler/tool pins and this cache recipe.
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.identity }}-${{ hashFiles('go/go.mod', 'go/go.sum', '.github/workflows/go.yml') }}

      - name: Check formatting
        if: needs.changes.outputs.relevant == 'true'
        run: test -z "$(gofmt -l .)"

      - name: Check module tidiness
        if: needs.changes.outputs.relevant == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify generated builders
        if: needs.changes.outputs.relevant == 'true'
        run: |
          go generate ./...
          git diff --exit-code -- concrete_builders_gen.go limits_gen.go

      - name: Verify release-note extraction
        if: needs.changes.outputs.relevant == 'true'
        run: |
          notes=$(printf '## [9.9.9] — 2099-01-01\n\nExpected notes.\n\n## [9.9.8] — 2098-01-01\n\nOlder notes.\n' | awk -v version="9.9.9" -f ../.github/scripts/extract-go-release-notes.awk)
          test "$notes" = "Expected notes."

      - name: Run vet
        if: needs.changes.outputs.relevant == 'true'
        run: go vet ./...

      - name: Run staticcheck
        if: needs.changes.outputs.relevant == 'true' && matrix.go-version == 'stable'
        env:
          # v0.8.1 cannot decode Go 1.27.2 export data. Keep runtime tests on stable;
          # remove this analyzer-only pin when a compatible Staticcheck is available.
          GOTOOLCHAIN: go1.26.9
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Run tests
        if: needs.changes.outputs.relevant == 'true'
        run: go test -count=1 -race -cover ./...
