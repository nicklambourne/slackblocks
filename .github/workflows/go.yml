name: Go

on:
  push:
    branches: [master]
    paths:
      - "go/**"
      - "spec/**"
      - "docs/examples/go/**"
      - "docs/docs/usage/using_blocks.mdx"
      - "java/generator/model.json"
      - ".github/scripts/extract-go-release-notes.awk"
      - ".github/workflows/go.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Compare changed files against this workflow's scope
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename') || files=""
          if [ -z "$files" ]; then
            # Fail open: if the file list cannot be read, run the real checks.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(go/|spec/|docs/examples/go/|docs/docs/usage/using_blocks\.mdx$|java/generator/model\.json$|\.github/scripts/extract-go-release-notes\.awk$|\.github/workflows/go\.yml$)' <<<"$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out repository
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Install Go ${{ matrix.go-version }}
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Check formatting
        if: needs.changes.outputs.relevant == 'true'
        run: test -z "$(gofmt -l .)"

      - name: Check module tidiness
        if: needs.changes.outputs.relevant == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify generated builders
        if: needs.changes.outputs.relevant == 'true'
        run: |
          go generate ./...
          git diff --exit-code -- concrete_builders_gen.go

      - name: Verify release-note extraction
        if: needs.changes.outputs.relevant == 'true'
        run: |
          notes=$(printf '## [9.9.9] — 2099-01-01\n\nExpected notes.\n\n## [9.9.8] — 2098-01-01\n\nOlder notes.\n' | awk -v version="9.9.9" -f ../.github/scripts/extract-go-release-notes.awk)
          test "$notes" = "Expected notes."

      - name: Run vet
        if: needs.changes.outputs.relevant == 'true'
        run: go vet ./...

      - name: Run staticcheck
        if: needs.changes.outputs.relevant == 'true' && matrix.go-version == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Run tests
        if: needs.changes.outputs.relevant == 'true'
        run: go test -race -cover ./...
