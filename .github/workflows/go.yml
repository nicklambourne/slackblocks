name: Go bounded cache controlled benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold:
    name: Go cache ${{ matrix.go }} ${{ matrix.pair }} ${{ matrix.variant }} cold
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        go: ["1.22.12", "1.27.3"]
        pair: [1, 2, 3]
        variant: [baseline, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: ${{ github.workspace }}/source
      EVIDENCE: ${{ github.workspace }}/evidence
      VARIANT: ${{ matrix.variant }}
      PAIR: ${{ matrix.pair }}
      GO_VERSION: ${{ matrix.go }}
      CONDITION: cold
      SOURCE_SHA: 5bed3a7ceca90e2c5fcf37377a43de105ab98022
    steps:
      - name: Check out measurement-only harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out identical fixed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5bed3a7ceca90e2c5fcf37377a43de105ab98022
          path: source
      - name: Install fixed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.16
      - name: Install fixed Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Set private cache locations
        run: |
          test ! -e "$RUNNER_TEMP/go-modules"
          test ! -e "$RUNNER_TEMP/go-build"
          {
            echo "GOMODCACHE=$RUNNER_TEMP/go-modules"
            echo "GOCACHE=$RUNNER_TEMP/go-build"
          } >> "$GITHUB_ENV"
      - name: Restore isolated candidate module and build cache
        if: matrix.variant == 'candidate'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/go-modules
            ${{ runner.temp }}/go-build
          key: go-bounded-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-${{ matrix.go }}-candidate-v1
      - name: Measure complete production phases and prove fresh test execution
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: python3 harness/.github/benchmarks/benchmark-go.py
      - name: Save isolated candidate cache
        if: matrix.variant == 'candidate' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/go-modules
            ${{ runner.temp }}/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Verify independent extracted source consumer
        run: python3 harness/.github/benchmarks/consumer.py
      - name: Preserve all evidence and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-cache-${{ matrix.go }}-${{ matrix.pair }}-${{ matrix.variant }}-cold
          path: evidence
          if-no-files-found: warn
          retention-days: 14
  warm:
    name: Go cache ${{ matrix.go }} ${{ matrix.pair }} ${{ matrix.variant }} warm
    needs: cold
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        go: ["1.22.12", "1.27.3"]
        pair: [1, 2, 3]
        variant: [baseline, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: ${{ github.workspace }}/source
      EVIDENCE: ${{ github.workspace }}/evidence
      VARIANT: ${{ matrix.variant }}
      PAIR: ${{ matrix.pair }}
      GO_VERSION: ${{ matrix.go }}
      CONDITION: warm
      SOURCE_SHA: 5bed3a7ceca90e2c5fcf37377a43de105ab98022
    steps:
      - name: Check out measurement-only harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out identical fixed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5bed3a7ceca90e2c5fcf37377a43de105ab98022
          path: source
      - name: Install fixed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.16
      - name: Install fixed Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Set private cache locations
        run: |
          test ! -e "$RUNNER_TEMP/go-modules"
          test ! -e "$RUNNER_TEMP/go-build"
          {
            echo "GOMODCACHE=$RUNNER_TEMP/go-modules"
            echo "GOCACHE=$RUNNER_TEMP/go-build"
          } >> "$GITHUB_ENV"
      - name: Restore isolated candidate module and build cache
        if: matrix.variant == 'candidate'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/go-modules
            ${{ runner.temp }}/go-build
          key: go-bounded-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-${{ matrix.go }}-candidate-v1
      - name: Measure complete production phases and prove fresh test execution
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: python3 harness/.github/benchmarks/benchmark-go.py
      - name: Save isolated candidate cache
        if: matrix.variant == 'candidate' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/go-modules
            ${{ runner.temp }}/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Verify independent extracted source consumer
        run: python3 harness/.github/benchmarks/consumer.py
      - name: Preserve all evidence and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-cache-${{ matrix.go }}-${{ matrix.pair }}-${{ matrix.variant }}-warm
          path: evidence
          if-no-files-found: warn
          retention-days: 14
