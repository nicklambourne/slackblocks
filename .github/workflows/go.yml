# Measurement only: never merge or publish.
name: Go Staticcheck controlled benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fc44939dffecb7437e41f670e2f9a726de0ed0ac
          path: source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.16
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.3
          cache: false
      - name: Restore first-cold dependency cache
        id: first-cold-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/staticcheck-first/cache/modules
            ${{ runner.temp }}/staticcheck-first/cache/build
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-deps-v1
      - name: Restore first-cold candidate tool
        if: matrix.pair == 2
        id: first-cold-tool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/staticcheck-first/cache/bin
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-binary-v1
      - name: Measure first-cold full native checks
        env:
          DEPENDENCY_HIT: ${{ steps.first-cold-deps.outputs.cache-hit }}
          TOOL_HIT: ${{ steps.first-cold-tool.outputs.cache-hit }}
        run: python harness/.github/benchmarks/go-staticcheck.py --source source --root "$RUNNER_TEMP/staticcheck-first" --output evidence/first-cold --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'candidate' || 'baseline' }}" --condition cold
      - name: Save first dependency cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/staticcheck-first/cache/modules
            ${{ runner.temp }}/staticcheck-first/cache/build
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-deps-v1
      - name: Save first candidate tool
        if: matrix.pair == 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/staticcheck-first/cache/bin
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-binary-v1
      - name: Discard only this sample's private cache before remote restore
        run: chmod -R u+w "$RUNNER_TEMP/staticcheck-first/cache" && rm -rf "$RUNNER_TEMP/staticcheck-first/cache"
      - name: Restore first-warm dependency cache
        id: first-warm-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/staticcheck-first/cache/modules
            ${{ runner.temp }}/staticcheck-first/cache/build
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-deps-v1
      - name: Restore first-warm candidate tool
        if: matrix.pair == 2
        id: first-warm-tool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/staticcheck-first/cache/bin
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-binary-v1
      - name: Measure first-warm full native checks
        env:
          DEPENDENCY_HIT: ${{ steps.first-warm-deps.outputs.cache-hit }}
          TOOL_HIT: ${{ steps.first-warm-tool.outputs.cache-hit }}
        run: python harness/.github/benchmarks/go-staticcheck.py --source source --root "$RUNNER_TEMP/staticcheck-first" --output evidence/first-warm --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'candidate' || 'baseline' }}" --condition warm
      - name: Preserve first evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staticcheck-${{ matrix.pair }}-first
          path: evidence/first-*
          if-no-files-found: warn
      - name: Restore second-cold dependency cache
        id: second-cold-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/staticcheck-second/cache/modules
            ${{ runner.temp }}/staticcheck-second/cache/build
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-deps-v1
      - name: Restore second-cold candidate tool
        if: matrix.pair != 2
        id: second-cold-tool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/staticcheck-second/cache/bin
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-binary-v1
      - name: Measure second-cold full native checks
        env:
          DEPENDENCY_HIT: ${{ steps.second-cold-deps.outputs.cache-hit }}
          TOOL_HIT: ${{ steps.second-cold-tool.outputs.cache-hit }}
        run: python harness/.github/benchmarks/go-staticcheck.py --source source --root "$RUNNER_TEMP/staticcheck-second" --output evidence/second-cold --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'baseline' || 'candidate' }}" --condition cold
      - name: Save second dependency cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/staticcheck-second/cache/modules
            ${{ runner.temp }}/staticcheck-second/cache/build
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-deps-v1
      - name: Save second candidate tool
        if: matrix.pair != 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/staticcheck-second/cache/bin
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-binary-v1
      - name: Discard only this sample's private cache before remote restore
        run: chmod -R u+w "$RUNNER_TEMP/staticcheck-second/cache" && rm -rf "$RUNNER_TEMP/staticcheck-second/cache"
      - name: Restore second-warm dependency cache
        id: second-warm-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/staticcheck-second/cache/modules
            ${{ runner.temp }}/staticcheck-second/cache/build
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-deps-v1
      - name: Restore second-warm candidate tool
        if: matrix.pair != 2
        id: second-warm-tool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/staticcheck-second/cache/bin
          key: staticcheck-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-binary-v1
      - name: Measure second-warm full native checks
        env:
          DEPENDENCY_HIT: ${{ steps.second-warm-deps.outputs.cache-hit }}
          TOOL_HIT: ${{ steps.second-warm-tool.outputs.cache-hit }}
        run: python harness/.github/benchmarks/go-staticcheck.py --source source --root "$RUNNER_TEMP/staticcheck-second" --output evidence/second-warm --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'baseline' || 'candidate' }}" --condition warm
      - name: Preserve second evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staticcheck-${{ matrix.pair }}-second
          path: evidence/second-*
          if-no-files-found: warn
