# Measurement only: no product change, publication, or merging.
name: Rust quality orchestration controlled benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fc44939dffecb7437e41f670e2f9a726de0ed0ac
          path: source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.16
      - name: Install fixed toolchains and components
        run: rustup toolchain install 1.99.0 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Compare independent owner and both complete quality policies
        run: python3 harness/.github/benchmarks/rust-quality.py --source source --root "$RUNNER_TEMP/rust-quality-pair" --output evidence --pair "${{ matrix.pair }}"
      - name: Preserve every sample and setup failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-quality-pair-${{ matrix.pair }}
          path: evidence
          if-no-files-found: warn
