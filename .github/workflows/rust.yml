name: Rust archive controlled benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: Rust archive baseline/candidate pair ${{ matrix.pair }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pair: [1, 2, 3]
    steps:
      - name: Check out measurement-only harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: harness
      - name: Check out fixed candidate source for both variants
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 455b4174eadc570f75cefa6b67ee36b279131c21
          persist-credentials: false
          path: source
      - name: Install fixed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - name: Install fixed minimum and current stable compilers
        run: |
          rustup toolchain install 1.85.0 1.99.0 --profile minimal
          rustc +1.85.0 -Vv
          rustc +1.99.0 -Vv
      - name: Measure two cold and two warm complete archive sequences
        run: >-
          python harness/.github/benchmarks/benchmark-rust.py
          --source source
          --baseline-checker harness/.github/benchmarks/rust-baseline-check-package.py
          --pair ${{ matrix.pair }}
          --output ${{ runner.temp }}/rust-archive-bench/pair-${{ matrix.pair }}/evidence
      - name: Preserve all measurements and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-archive-pair-${{ matrix.pair }}
          path: ${{ runner.temp }}/rust-archive-bench/pair-${{ matrix.pair }}/evidence
          if-no-files-found: error
          retention-days: 14
