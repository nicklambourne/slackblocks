name: Rust coverage tool controlled benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold:
    name: Rust tool ${{ matrix.pair }} ${{ matrix.variant }} cold
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
        variant: [baseline, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: ${{ github.workspace }}/source
      EVIDENCE: ${{ github.workspace }}/evidence
      RUSTUP_TOOLCHAIN: 1.99.0
      VARIANT: ${{ matrix.variant }}
      PAIR: ${{ matrix.pair }}
      CONDITION: cold
    steps:
      - name: Set private cache locations
        run: |
          test ! -e "$RUNNER_TEMP/coverage-tool"
          test ! -e "$RUNNER_TEMP/coverage-cargo"
          echo "TOOL_ROOT=$RUNNER_TEMP/coverage-tool" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/coverage-cargo" >> "$GITHUB_ENV"
      - name: Check out measurement-only harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out identical fixed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 496b9cbde202d5891b2721bd79c6446dacba76f3
          path: source
      - name: Install fixed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.16
      - name: Install fixed Rust and LLVM tools
        run: rustup toolchain install 1.99.0 --profile minimal --component llvm-tools-preview
      - name: Restore isolated dependency and coverage build cache
        id: dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/coverage-cargo/registry/index
            ${{ runner.temp }}/coverage-cargo/registry/cache
            ${{ runner.temp }}/coverage-cargo/git/db
            source/rust/target
          key: rust-tool-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-${{ matrix.variant }}-dependencies-v1
      - name: Restore isolated candidate tool cache
        if: matrix.variant == 'candidate'
        id: tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/coverage-tool
          key: rust-tool-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-candidate-tool-1.99.0-0.9.1-v1
      - name: Measure install and unchanged full coverage execution
        env:
          TOOL_HIT: ${{ steps.tool.outputs.cache-hit }}
          DEPENDENCY_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: python3 harness/.github/benchmarks/benchmark-tool.py
      - name: Preserve all evidence and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-tool-${{ matrix.pair }}-${{ matrix.variant }}-cold
          path: evidence
          if-no-files-found: warn
          retention-days: 14
  warm:
    name: Rust tool ${{ matrix.pair }} ${{ matrix.variant }} warm
    needs: cold
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
        variant: [baseline, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: ${{ github.workspace }}/source
      EVIDENCE: ${{ github.workspace }}/evidence
      RUSTUP_TOOLCHAIN: 1.99.0
      VARIANT: ${{ matrix.variant }}
      PAIR: ${{ matrix.pair }}
      CONDITION: warm
    steps:
      - name: Set private cache locations
        run: |
          test ! -e "$RUNNER_TEMP/coverage-tool"
          test ! -e "$RUNNER_TEMP/coverage-cargo"
          echo "TOOL_ROOT=$RUNNER_TEMP/coverage-tool" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/coverage-cargo" >> "$GITHUB_ENV"
      - name: Check out measurement-only harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out identical fixed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 496b9cbde202d5891b2721bd79c6446dacba76f3
          path: source
      - name: Install fixed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.16
      - name: Install fixed Rust and LLVM tools
        run: rustup toolchain install 1.99.0 --profile minimal --component llvm-tools-preview
      - name: Restore isolated dependency and coverage build cache
        id: dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/coverage-cargo/registry/index
            ${{ runner.temp }}/coverage-cargo/registry/cache
            ${{ runner.temp }}/coverage-cargo/git/db
            source/rust/target
          key: rust-tool-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-${{ matrix.variant }}-dependencies-v1
      - name: Restore isolated candidate tool cache
        if: matrix.variant == 'candidate'
        id: tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/coverage-tool
          key: rust-tool-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-candidate-tool-1.99.0-0.9.1-v1
      - name: Measure install and unchanged full coverage execution
        env:
          TOOL_HIT: ${{ steps.tool.outputs.cache-hit }}
          DEPENDENCY_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: python3 harness/.github/benchmarks/benchmark-tool.py
      - name: Preserve all evidence and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-tool-${{ matrix.pair }}-${{ matrix.variant }}-warm
          path: evidence
          if-no-files-found: warn
          retention-days: 14
