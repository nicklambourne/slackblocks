# Measurement only; never merge. No package/release dispatch.
name: Documentation Rustfmt component comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    env:
      BENCH_PAIR: ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: fc44939dffecb7437e41f670e2f9a726de0ed0ac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - name: Compare four private copies of the hosted toolchain state
        run: python harness/.github/benchmarks/docs-rustfmt.py
      - name: Preserve every measurement and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustfmt-components-${{ matrix.pair }}
          path: evidence
          if-no-files-found: error
