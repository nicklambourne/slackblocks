name: Publish Python Package

on:
  push:
    tags:
      - "python/v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Python release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Verify Python and TypeScript versions match
        run: |
          set -euo pipefail
          python_version=$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          typescript_version=$(uv run --frozen python -c "import json; print(json.load(open('../typescript/package.json'))['version'])")
          if [ "$python_version" != "$typescript_version" ]; then
            echo "::error::Python version '$python_version' does not match TypeScript version '$typescript_version'. Releases are coordinated; bump both together."
            exit 1
          fi

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#python/v}"
          package=$(uv run --frozen python -c "import importlib.metadata; print(importlib.metadata.version('slackblocks'))")
          if [ "$tag" != "$package" ]; then
            echo "::error::Tag '$tag' does not match package version '$package'."
            exit 1
          fi

      - name: Run tests
        run: uv run --frozen pytest test/unit test/conformance test/docs

      - name: Build sdist and wheel
        run: uv build --clear

      - name: Validate package metadata
        run: uv run --frozen twine check --strict dist/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/slackblocks/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Publish with trusted publishing
        run: uv publish --check-url https://pypi.org/simple/slackblocks/ dist/*

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release for $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          version="${GITHUB_REF_NAME#python/v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' python/CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "Python v$version" --notes-file release-notes.md
          else
            echo "::warning::Could not extract changelog section for $version; using generated notes."
            gh release create "$GITHUB_REF_NAME" --title "Python v$version" --generate-notes
          fi
