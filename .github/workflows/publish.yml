name: Publish Python Package

on:
  push:
    tags:
      - "python/v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Python release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#python/v}"
          package=$(uv run --frozen python -c "import importlib.metadata; print(importlib.metadata.version('slackblocks'))")
          if [ "$tag" != "$package" ]; then
            echo "::error::Tag '$tag' does not match package version '$package'."
            exit 1
          fi

      - name: Run tests
        run: uv run --frozen pytest test/unit test/conformance

      - name: Build sdist and wheel
        run: uv build --clear

      - name: Validate package metadata
        run: uv run --frozen twine check --strict dist/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/slackblocks/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Publish with trusted publishing
        run: uv publish dist/*
