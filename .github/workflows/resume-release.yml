name: Follow Up Pending Release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pending-release-followup
  cancel-in-progress: false

jobs:
  observe:
    name: Resume recorded availability waits only
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reconcile pending releases within their original 24-hour window
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_followup.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-followup-${{ github.run_id }}
          path: ${{ runner.temp }}/release-followup/
          if-no-files-found: ignore
