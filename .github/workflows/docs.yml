name: Documentation

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "python/**"
      - "typescript/src/**"
      - "typescript/package.json"
      - "typescript/tsconfig.json"
      - "typescript/tsconfig.typedoc.json"
      - "go/**"
      - "java/**"
      - "csharp/**"
      - "ruby/**"
      - "rust/**"
      - "php/**"
      - "README.md"
      - "spec/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Compare changed files against this workflow's scope
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename') || files=""
          if [ -z "$files" ]; then
            # Fail open: if the file list cannot be read, run the real checks.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(docs/|python/|typescript/src/|typescript/package\.json$|typescript/tsconfig\.json$|typescript/tsconfig\.typedoc\.json$|go/|java/|csharp/|ruby/|rust/|php/|README\.md$|spec/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/docs\.yml$)' <<<"$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          cache-dependency-glob: python/uv.lock
          python-version: "3.14"

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      - name: Install Java for the javadoc-generated API reference
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Install .NET for the C# API reference
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Ruby for executable guide examples
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4"

      - name: Install Rust for native reference and executable guide examples
        run: |
          rustup toolchain install stable 1.85.0 --profile minimal --component rustfmt
          rustup default stable

      - name: Install PHP for native reference and executable guide examples
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --working-dir=php --no-interaction --prefer-dist

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm --filter @slackblocks/docs build

      - name: Verify immutable historical snapshots
        run: pnpm --filter @slackblocks/docs check:legacy-snapshots

      - name: Verify every released version has a docs snapshot
        run: pnpm --filter @slackblocks/docs check:release-snapshots

      - name: Verify documentation generation is clean
        run: >-
          git diff --exit-code --
          docs/legacy/manifest.json
          docs/versioned_docs
          docs/versioned_sidebars
          docs/static/img/legacy

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: Deploy GitHub Pages
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
