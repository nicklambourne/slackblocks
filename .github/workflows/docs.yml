name: Documentation

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "python/**"
      - "typescript/src/**"
      - "typescript/package.json"
      - "typescript/tsconfig.json"
      - "typescript/tsconfig.typedoc.json"
      - "spec/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "python/**"
      - "typescript/src/**"
      - "typescript/package.json"
      - "typescript/tsconfig.json"
      - "typescript/tsconfig.typedoc.json"
      - "spec/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          cache-dependency-glob: python/uv.lock
          python-version: "3.14"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm --filter @slackblocks/docs build

      - name: Verify immutable historical snapshots
        run: pnpm --filter @slackblocks/docs check:legacy-snapshots

      - name: Verify every released version has a docs snapshot
        run: pnpm --filter @slackblocks/docs check:release-snapshots

      - name: Verify documentation generation is clean
        run: >-
          git diff --exit-code --
          docs/legacy/manifest.json
          docs/versioned_docs
          docs/versioned_sidebars
          docs/static/img/legacy

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: Deploy GitHub Pages
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
