name: Package Check

on:
  push:
    branches: [master]
    paths:
      - "python/**"
      - ".github/workflows/package-check.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/package-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-check:
    name: Build sdist/wheel and validate metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build sdist and wheel
        run: uv build --clear

      - name: Validate package metadata and README
        run: uv run --frozen twine check --strict dist/*

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import slackblocks; print(slackblocks.__name__)"

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import slackblocks; print(slackblocks.__name__)"
