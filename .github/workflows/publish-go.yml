name: Publish Go Module

on:
  push:
    tags:
      - "go/v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged Go module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify seven-language release activation, tags and commit
        working-directory: .
        run: python3 .github/scripts/verify-release.py publisher --language go

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -cover ./...

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release for $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          version="${GITHUB_REF_NAME#go/v}"
          awk -v version="$version" -f .github/scripts/extract-go-release-notes.awk go/CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "Go v$version" --notes-file release-notes.md
          else
            echo "::warning::Could not extract changelog section for $version; using generated notes."
            gh release create "$GITHUB_REF_NAME" --title "Go v$version" --generate-notes
          fi
