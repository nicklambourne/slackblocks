name: TypeScript

on:
  push:
    branches: [master]
    paths:
      - "typescript/**"
      - "spec/**"
      - "docs/examples/typescript/**"
      - "docs/examples/section_hello.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/typescript.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Compare changed files against this workflow's scope
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename') || files=""
          if [ -z "$files" ]; then
            # Fail open: if the file list cannot be read, run the real checks.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(typescript/|spec/|docs/examples/typescript/|docs/examples/section_hello\.json$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/typescript\.yml$)' <<<"$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: changes
    name: TypeScript quality and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Install pnpm
        if: needs.changes.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Type check
        if: needs.changes.outputs.relevant == 'true'
        run: pnpm --filter @nicklambourne/slackblocks typecheck

      - name: Run unit, conformance, and docs-example tests
        if: needs.changes.outputs.relevant == 'true'
        run: pnpm --filter @nicklambourne/slackblocks test

      - name: Validate package
        if: needs.changes.outputs.relevant == 'true'
        run: pnpm --filter @nicklambourne/slackblocks check:package

      - name: Pack package
        if: needs.changes.outputs.relevant == 'true'
        run: |
          mkdir -p artifacts
          pnpm --dir typescript pack --pack-destination ../artifacts

      - name: Upload package
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: slackblocks-package
          path: artifacts/*.tgz
          if-no-files-found: error

  runtime-smoke:
    name: Runtime smoke (Node ${{ matrix.node-version }})
    needs: [changes, quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.0", "22", "24"]
    steps:
      - name: Install Node.js ${{ matrix.node-version }}
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download package
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: slackblocks-package
          path: package

      - name: Install package
        if: needs.changes.outputs.relevant == 'true'
        run: npm install --ignore-scripts ./package/nicklambourne-slackblocks-*.tgz

      - name: Import from ESM
        if: needs.changes.outputs.relevant == 'true'
        run: >-
          node --input-type=module -e
          'import("@nicklambourne/slackblocks").then(({sectionBlock}) =>
          console.log(JSON.stringify(sectionBlock({text:"smoke"}))))'

      - name: Require ESM from CommonJS
        if: needs.changes.outputs.relevant == 'true'
        run: >-
          node -e
          'const { sectionBlock } = require("@nicklambourne/slackblocks");
          console.log(JSON.stringify(sectionBlock({text:"smoke"})))'
