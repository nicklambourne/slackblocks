name: TypeScript

on:
  push:
    branches: [master]
    paths:
      - "typescript/**"
      - "spec/**"
      - "docs/examples/typescript/**"
      - "docs/examples/section_hello.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "typescript/**"
      - "spec/**"
      - "docs/examples/typescript/**"
      - "docs/examples/section_hello.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript quality and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter slackblocks typecheck

      - name: Run unit, conformance, and docs-example tests
        run: pnpm --filter slackblocks test

      - name: Validate package
        run: pnpm --filter slackblocks check:package

      - name: Pack package
        run: |
          mkdir -p artifacts
          pnpm --dir typescript pack --pack-destination ../artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: slackblocks-package
          path: artifacts/*.tgz
          if-no-files-found: error

  runtime-smoke:
    name: Runtime smoke (Node ${{ matrix.node-version }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.0", "22", "24"]
    steps:
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download package
        uses: actions/download-artifact@v8.0.1
        with:
          name: slackblocks-package
          path: package

      - name: Install package
        run: npm install --ignore-scripts ./package/slackblocks-*.tgz

      - name: Import from ESM
        run: >-
          node --input-type=module -e
          'import("slackblocks").then(({section}) =>
          console.log(JSON.stringify(section({text:"smoke"}))))'

      - name: Require ESM from CommonJS
        run: >-
          node -e
          'const { section } = require("slackblocks");
          console.log(JSON.stringify(section({text:"smoke"})))'
