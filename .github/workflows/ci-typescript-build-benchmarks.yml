name: TypeScript build reuse controlled comparison
on:
  push:
    branches: [codex/ci-typescript-build-benchmarks]
    paths: [.github/workflows/ci-typescript-build-benchmarks.yml, .github/benchmarks/typescript-build.py, .github/benchmarks/sdk-observer.cjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pair: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 99ac8980573b7b8e6b76f0cb1a08f741f15f2c62
          path: source
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - name: Paired cold and warm full native and installed SDK checks
        env:
          SAMPLE_PAIR: ${{ matrix.pair }}
        run: |
          set -euo pipefail
          policies="baseline candidate"
          if [ "$SAMPLE_PAIR" = "2" ]; then policies="candidate baseline"; fi
          for policy in $policies; do
            python harness/.github/benchmarks/typescript-build.py --source source \
              --output "evidence/$policy" --variant "$policy" --pair "$SAMPLE_PAIR" \
              --cache "$RUNNER_TEMP/typescript-build-${{ github.run_id }}-${{ github.run_attempt }}-$policy-$SAMPLE_PAIR"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: build-pair-${{ matrix.pair }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
