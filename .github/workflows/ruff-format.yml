name: Ruff Format
on:
  push:
    branches: [master]
    paths:
      - "python/**"
      - "spec/tools/**"
      - ".github/workflows/ruff-format.yml"
  pull_request:
    paths:
      - "python/**"
      - "spec/tools/**"
      - ".github/workflows/ruff-format.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-latest
    name: Ruff Format
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check Out Source Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install Dependencies
        run: uv sync

      - name: Formatting
        run: uv run ruff format --check slackblocks test ../spec/tools
