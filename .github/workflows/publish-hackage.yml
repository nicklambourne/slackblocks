name: Publish Haskell Package

on:
  pull_request:
    paths: ["haskell/**", ".github/scripts/**", ".github/workflows/publish-hackage.yml", ".github/workflows/coordinated-release.yml"]
  push:
    tags: ["haskell/v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackage-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Hackage release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify ten-language activation, tags and commit
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/verify-release.py publisher --language haskell
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.16.1.0"
      - name: Resolve package index
        run: cabal update
      - name: Test release guards without credentials
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Build tested source and native Haddock artifacts, then verify reproduction
        run: |
          python3 haskell/bin/release.py prepare
          python3 haskell/bin/release.py verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: haskell-release
          path: haskell/dist-release/*
          if-no-files-found: error

  publish:
    name: Publish Hackage package and Haddock
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: hackage
      url: https://hackage.haskell.org/package/slackblocks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck activation and exact tag before credentials
        run: python3 .github/scripts/verify-release.py publisher --language haskell
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.16.1.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: haskell-release
          path: haskell/dist-release
      - name: Upload only missing matching artifacts and verify public bytes
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: python3 haskell/bin/release.py publish

  consumers:
    name: Verify Hackage install (GHC ${{ matrix.ghc }})
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6.7", "9.14.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.16.1.0"
      - name: Independently install public registry package and execute consumer
        run: python3 haskell/bin/release.py consumer

  github-release:
    name: Create Haskell GitHub Release
    if: github.event_name != 'pull_request'
    needs: consumers
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.16.1.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: haskell-release
          path: haskell/dist-release
      - name: Complete exact-tag release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 haskell/bin/github_release.py
