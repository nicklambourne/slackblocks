name: Ruff Lint

on:
  push:
    paths:
      - "python/**"
      - "docs/scripts/**"
      - ".github/workflows/ruff-lint.yml"
  pull_request:
    branches: [master]
    paths:
      - "python/**"
      - "docs/scripts/**"
      - ".github/workflows/ruff-lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    name: Ruff Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run --frozen ruff check slackblocks test ../docs/scripts
