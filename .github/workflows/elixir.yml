# Measurement-only workflow: never merge or publish.
name: Elixir PLT controlled benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold:
    name: Elixir PLT ${{ matrix.pair }} ${{ matrix.variant }} cold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pair: [1, 2, 3]
        variant: [baseline, candidate]
    env:
      SOURCE: ${{ github.workspace }}/source
      EVIDENCE: ${{ github.workspace }}/evidence
      VARIANT: ${{ matrix.variant }}
      PAIR: ${{ matrix.pair }}
      PYTHONPATH: ${{ github.workspace }}/harness/.github/benchmarks
      SOURCE_SHA: 64549806024f17be7a602abbf4ef9728495f84ad
      CONDITION: cold
    steps:
      - name: Check out measurement harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out fixed identical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 64549806024f17be7a602abbf4ef9728495f84ad
          path: source
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.16.3"
          otp-version: "26.2"
          rebar3-version: "3.27.1"
          version-type: strict
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.16"
      - name: Fixed quality tooling and runtime evidence
        run: |
          python -m pip install --no-cache-dir ruff==0.15.12
          mkdir -p evidence
          { elixir --version; rebar3 --version; python --version; ruff --version; } > evidence/versions.txt 2>&1
          elixir -e 'release = to_string(:erlang.system_info(:otp_release)); otp = File.read!(Path.join([to_string(:code.root_dir()), "releases", release, "OTP_VERSION"])); IO.inspect({System.build_info(), :erlang.system_info(:version), :erlang.system_info(:system_architecture), otp})' > evidence/beam-identity.txt
          git -C harness rev-parse HEAD > evidence/harness-commit.txt
          test ! -d source/elixir/_build
      - name: Restore isolated candidate PLTs
        if: matrix.variant == 'candidate'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: source/elixir/_build/dev/plts
          key: elixir-plt-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-candidate-v1
      - name: Measure unchanged complete quality and independent consumers
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/elixir-plt.py
      - name: Save isolated candidate PLTs
        if: matrix.variant == 'candidate' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: source/elixir/_build/dev/plts
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Preserve all samples and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elixir-plt-${{ matrix.pair }}-${{ matrix.variant }}-cold
          path: evidence
          if-no-files-found: error
          retention-days: 14
  warm:
    name: Elixir PLT ${{ matrix.pair }} ${{ matrix.variant }} warm
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pair: [1, 2, 3]
        variant: [baseline, candidate]
    env:
      SOURCE: ${{ github.workspace }}/source
      EVIDENCE: ${{ github.workspace }}/evidence
      VARIANT: ${{ matrix.variant }}
      PAIR: ${{ matrix.pair }}
      PYTHONPATH: ${{ github.workspace }}/harness/.github/benchmarks
      SOURCE_SHA: 64549806024f17be7a602abbf4ef9728495f84ad
      CONDITION: warm
    steps:
      - name: Check out measurement harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out fixed identical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 64549806024f17be7a602abbf4ef9728495f84ad
          path: source
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.16.3"
          otp-version: "26.2"
          rebar3-version: "3.27.1"
          version-type: strict
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.16"
      - name: Fixed quality tooling and runtime evidence
        run: |
          python -m pip install --no-cache-dir ruff==0.15.12
          mkdir -p evidence
          { elixir --version; rebar3 --version; python --version; ruff --version; } > evidence/versions.txt 2>&1
          elixir -e 'release = to_string(:erlang.system_info(:otp_release)); otp = File.read!(Path.join([to_string(:code.root_dir()), "releases", release, "OTP_VERSION"])); IO.inspect({System.build_info(), :erlang.system_info(:version), :erlang.system_info(:system_architecture), otp})' > evidence/beam-identity.txt
          git -C harness rev-parse HEAD > evidence/harness-commit.txt
          test ! -d source/elixir/_build
      - name: Restore isolated candidate PLTs
        if: matrix.variant == 'candidate'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: source/elixir/_build/dev/plts
          key: elixir-plt-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-candidate-v1
      - name: Measure unchanged complete quality and independent consumers
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/elixir-plt.py
      - name: Save isolated candidate PLTs
        if: matrix.variant == 'candidate' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: source/elixir/_build/dev/plts
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Reject invalid contract after a warm PLT hit (outside timings)
        if: matrix.variant == 'candidate' && matrix.pair == 1
        run: python harness/.github/benchmarks/warm-plt-mutation.py
      - name: Preserve all samples and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elixir-plt-${{ matrix.pair }}-${{ matrix.variant }}-warm
          path: evidence
          if-no-files-found: error
          retention-days: 14
