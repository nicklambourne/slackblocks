# Measurement-only branch: never publish, deploy or merge this workflow.
name: Elixir controlled benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elixir-controlled-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    name: Elixir baseline/candidate pair ${{ matrix.pair }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    env:
      BENCH_PAIR: ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.16.3"
          otp-version: "26.2"
          rebar3-version: "3.27.1"
          version-type: strict
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.16"
      - name: Fixed common quality toolchain
        run: |
          python -m pip install --no-cache-dir ruff==0.15.12
          mkdir -p runtime-evidence
          { elixir --version; rebar3 --version; python --version; ruff --version; } > runtime-evidence/versions.txt 2>&1
          git rev-parse HEAD > runtime-evidence/harness-commit.txt
      - name: Four complete quality jobs with cold then warm dependency caches
        run: python .github/benchmarks/elixir-paired.py
      - name: Retain successful and failed measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elixir-controlled-pair-${{ matrix.pair }}
          path: |
            benchmark-results
            runtime-evidence
          if-no-files-found: error
          retention-days: 7
