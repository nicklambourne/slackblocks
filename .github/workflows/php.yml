# Measurement only: never merge or publish.
name: PHP Composer download cache controlled comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fc44939dffecb7437e41f670e2f9a726de0ed0ac
          path: source
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2.34'
          tools: composer:2.10.3
          coverage: xdebug
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - name: Restore first-cold candidate downloads
        id: first-cold-cache
        if: matrix.pair == 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/php-cache-first/downloads/files
          key: composer-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-v1
      - name: Measure first-cold install and full quality checks
        env:
          CACHE_HIT: ${{ steps.first-cold-cache.outputs.cache-hit }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: python harness/.github/benchmarks/php-cache.py --source source --root "$RUNNER_TEMP/php-cache-first" --output evidence/first-cold --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'candidate' || 'baseline' }}" --condition cold
      - name: Save first candidate downloads
        if: matrix.pair == 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/php-cache-first/downloads/files
          key: composer-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-v1
      - name: Discard only this sample's private download directory
        if: matrix.pair == 2
        run: rm -rf "$RUNNER_TEMP/php-cache-first/downloads"
      - name: Restore first-warm candidate downloads
        id: first-warm-cache
        if: matrix.pair == 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/php-cache-first/downloads/files
          key: composer-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-v1
      - name: Measure first-warm install and full quality checks
        env:
          CACHE_HIT: ${{ steps.first-warm-cache.outputs.cache-hit }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: python harness/.github/benchmarks/php-cache.py --source source --root "$RUNNER_TEMP/php-cache-first" --output evidence/first-warm --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'candidate' || 'baseline' }}" --condition warm
      - name: Preserve first successes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: php-cache-${{ matrix.pair }}-first
          path: evidence/first-*
          if-no-files-found: warn
      - name: Restore second-cold candidate downloads
        id: second-cold-cache
        if: matrix.pair != 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/php-cache-second/downloads/files
          key: composer-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-v1
      - name: Measure second-cold install and full quality checks
        env:
          CACHE_HIT: ${{ steps.second-cold-cache.outputs.cache-hit }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: python harness/.github/benchmarks/php-cache.py --source source --root "$RUNNER_TEMP/php-cache-second" --output evidence/second-cold --pair "${{ matrix.pair }}" --variant "${{ matrix.pair != 2 && 'candidate' || 'baseline' }}" --condition cold
      - name: Save second candidate downloads
        if: matrix.pair != 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/php-cache-second/downloads/files
          key: composer-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-v1
      - name: Discard only this sample's private download directory
        if: matrix.pair != 2
        run: rm -rf "$RUNNER_TEMP/php-cache-second/downloads"
      - name: Restore second-warm candidate downloads
        id: second-warm-cache
        if: matrix.pair != 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/php-cache-second/downloads/files
          key: composer-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-v1
      - name: Measure second-warm install and full quality checks
        env:
          CACHE_HIT: ${{ steps.second-warm-cache.outputs.cache-hit }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: python harness/.github/benchmarks/php-cache.py --source source --root "$RUNNER_TEMP/php-cache-second" --output evidence/second-warm --pair "${{ matrix.pair }}" --variant "${{ matrix.pair != 2 && 'candidate' || 'baseline' }}" --condition warm
      - name: Preserve second successes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: php-cache-${{ matrix.pair }}-second
          path: evidence/second-*
          if-no-files-found: warn
