name: PHP package phase profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    name: PHP package profile (${{ matrix.os }}, ${{ matrix.pair }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [windows-2025]
        pair: [1, 2, 3]
    env:
      PAIR: ${{ matrix.pair }}
      SOURCE: ${{ github.workspace }}/source
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - name: Check out profile harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out fixed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 92740b4bf585de5b1a0c7619ce4f082a97d90532
          path: source
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2.34'
          tools: composer:2.10.3
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - name: Profile cold package validation and four consumers
        run: python harness/.github/benchmarks/php-package-profile.py cold
      - name: Profile warm package validation and four fresh consumers
        run: python harness/.github/benchmarks/php-package-profile.py warm
      - name: Preserve all results and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: php-package-${{ matrix.os }}-${{ matrix.pair }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
