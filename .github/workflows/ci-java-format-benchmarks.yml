name: Java formatter controlled comparison
on:
  push:
    branches: [codex/ci-java-format-benchmarks]
    paths: [.github/workflows/ci-java-format-benchmarks.yml, .github/benchmarks/java-format.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        java: ['25.0.4+1', '27.0.0+35']
        pair: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9cbf17f63038b269b2e1f0f3c782c47e073346d3
          path: source
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - name: Paired policies on one host, cold then warm per policy
        env:
          SAMPLE_JDK: ${{ matrix.java }}
          SAMPLE_PAIR: ${{ matrix.pair }}
        run: |
          set -euo pipefail
          policies="baseline candidate"
          if [ "$SAMPLE_PAIR" = "2" ]; then policies="candidate baseline"; fi
          for policy in $policies; do
            python harness/.github/benchmarks/java-format.py --source source \
              --output "evidence/$policy" \
              --cache "$RUNNER_TEMP/java-format-${{ github.run_id }}-${{ github.run_attempt }}-$SAMPLE_JDK-$policy-$SAMPLE_PAIR" \
              --variant "$policy" --pair "$SAMPLE_PAIR" --jdk "$SAMPLE_JDK"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: format-${{ matrix.java }}-pair-${{ matrix.pair }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
