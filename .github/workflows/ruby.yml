# Measurement-only same-host confirmation; never merge or publish.
name: Ruby paired dependency benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: Ruby dependency pair ${{ matrix.pair }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pair: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3f224a6e89751d00c0391dc52d6578f0e943d0f5
          path: source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - name: Install common fixed Ruby and Bundler
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.4.11'
          bundler: '4.0.21'
          bundler-cache: false
      - name: Compare private cold and warm bundles on the same host
        env:
          BENCH_PAIR: ${{ matrix.pair }}
        run: python harness/.github/benchmarks/ruby-paired.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ruby-paired-${{ matrix.pair }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
