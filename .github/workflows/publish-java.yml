name: Publish Java Package

on:
  push:
    tags:
      - "java/v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing java/vX.Y.Z tag to recover using the current publishing workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish to Maven Central
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.nicklambourne/slackblocks
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Keep the workflow's tested Maven launcher when recovering an immutable older tag.
      - name: Preserve the release Maven launcher
        run: |
          mkdir -p "$RUNNER_TEMP/release-maven/.mvn/wrapper"
          cp java/mvnw "$RUNNER_TEMP/release-maven/mvnw"
          cp java/.mvn/wrapper/maven-wrapper.properties "$RUNNER_TEMP/release-maven/.mvn/wrapper/"

      - name: Check out the existing release tag for recovery
        if: inputs.release_tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify seven-language release activation, tags and commit
        working-directory: .
        env:
          RELEASE_REF: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: GITHUB_REF="$RELEASE_REF" python3 .github/scripts/verify-release.py publisher --language java

      - name: Install Java and configure Maven Central
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/pom.xml
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Publish signed bundle
        working-directory: java
        run: '"$RUNNER_TEMP/release-maven/mvnw" -B -ntp -Prelease clean deploy'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: java-distributions
          path: java/target/*.jar
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release for $RELEASE_TAG already exists; skipping."
            exit 0
          fi
          version="${RELEASE_TAG#java/v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' java/CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$RELEASE_TAG" --title "Java v$version" --notes-file release-notes.md
          else
            echo "::warning::Could not extract changelog section for $version; using generated notes."
            gh release create "$RELEASE_TAG" --title "Java v$version" --generate-notes
          fi
