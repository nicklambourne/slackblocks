# Measurement only; never merge or dispatch a publisher.
name: Release pack reuse controlled comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
    steps:
      - name: Select private SDK installation
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/fixed-dotnet" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: fc44939dffecb7437e41f670e2f9a726de0ed0ac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            8.0.426
            10.0.402
      - name: Compare full tests then pack with validation controls
        run: python harness/.github/benchmarks/dotnet-pack.py --source source --locks harness/.github/benchmarks/fixed-nuget-locks --root "$RUNNER_TEMP/pack-pair" --output evidence --pair "${{ matrix.pair }}"
      - name: Preserve successes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dotnet-pack-${{ matrix.pair }}
          path: evidence
          if-no-files-found: warn
