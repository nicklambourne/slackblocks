# Measurement only; never merge or dispatch a publisher.
name: NuGet package cache controlled comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
    steps:
      - name: Select private SDK installation
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/fixed-dotnet" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: fc44939dffecb7437e41f670e2f9a726de0ed0ac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            8.0.426
            10.0.402
      - name: Restore first-cold candidate packages
        id: first-cold-cache
        if: matrix.pair == 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/nuget-cache-first/cache/packages
          key: nuget-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-v1
      - name: Measure first-cold complete canonical checks
        env:
          CACHE_HIT: ${{ steps.first-cold-cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/nuget-cache.py --source source --locks harness/.github/benchmarks/fixed-nuget-locks --root "$RUNNER_TEMP/nuget-cache-first" --output evidence/first-cold --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'candidate' || 'baseline' }}" --condition cold
      - name: Save first candidate packages
        if: matrix.pair == 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/nuget-cache-first/cache/packages
          key: nuget-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-v1
      - name: Discard only this sample's private packages
        if: matrix.pair == 2
        run: rm -rf "$RUNNER_TEMP/nuget-cache-first/cache/packages"
      - name: Restore first-warm candidate packages
        id: first-warm-cache
        if: matrix.pair == 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/nuget-cache-first/cache/packages
          key: nuget-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-first-v1
      - name: Measure first-warm complete canonical checks
        env:
          CACHE_HIT: ${{ steps.first-warm-cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/nuget-cache.py --source source --locks harness/.github/benchmarks/fixed-nuget-locks --root "$RUNNER_TEMP/nuget-cache-first" --output evidence/first-warm --pair "${{ matrix.pair }}" --variant "${{ matrix.pair == 2 && 'candidate' || 'baseline' }}" --condition warm
      - name: Preserve first successes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nuget-cache-${{ matrix.pair }}-first
          path: evidence/first-*
          if-no-files-found: warn
      - name: Restore second-cold candidate packages
        id: second-cold-cache
        if: matrix.pair != 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/nuget-cache-second/cache/packages
          key: nuget-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-v1
      - name: Measure second-cold complete canonical checks
        env:
          CACHE_HIT: ${{ steps.second-cold-cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/nuget-cache.py --source source --locks harness/.github/benchmarks/fixed-nuget-locks --root "$RUNNER_TEMP/nuget-cache-second" --output evidence/second-cold --pair "${{ matrix.pair }}" --variant "${{ matrix.pair != 2 && 'candidate' || 'baseline' }}" --condition cold
      - name: Save second candidate packages
        if: matrix.pair != 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/nuget-cache-second/cache/packages
          key: nuget-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-v1
      - name: Discard only this sample's private packages
        if: matrix.pair != 2
        run: rm -rf "$RUNNER_TEMP/nuget-cache-second/cache/packages"
      - name: Restore second-warm candidate packages
        id: second-warm-cache
        if: matrix.pair != 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/nuget-cache-second/cache/packages
          key: nuget-eval-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pair }}-second-v1
      - name: Measure second-warm complete canonical checks
        env:
          CACHE_HIT: ${{ steps.second-warm-cache.outputs.cache-hit }}
        run: python harness/.github/benchmarks/nuget-cache.py --source source --locks harness/.github/benchmarks/fixed-nuget-locks --root "$RUNNER_TEMP/nuget-cache-second" --output evidence/second-warm --pair "${{ matrix.pair }}" --variant "${{ matrix.pair != 2 && 'candidate' || 'baseline' }}" --condition warm
      - name: Preserve second successes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nuget-cache-${{ matrix.pair }}-second
          path: evidence/second-*
          if-no-files-found: warn
