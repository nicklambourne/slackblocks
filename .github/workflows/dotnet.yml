# Measurement-only workflow. Never merge or publish.
name: Windows runtime controlled benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locks:
    name: Freeze NuGet dependency inputs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dfd1d4bab345abfe150ab56d8268479aaf56bcf2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
      - name: Freeze exact dependency locks
        shell: pwsh
        run: |
          dotnet restore csharp/Slackblocks.sln --use-lock-file --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force locks/src/Slackblocks, locks/tests/Slackblocks.Tests | Out-Null
          Copy-Item csharp/src/Slackblocks/packages.lock.json locks/src/Slackblocks/packages.lock.json
          Copy-Item csharp/tests/Slackblocks.Tests/packages.lock.json locks/tests/Slackblocks.Tests/packages.lock.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fixed-nuget-locks
          path: locks
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: locks
    name: Windows runtime ${{ matrix.pair }} ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pair: [1, 2, 3]
        variant: [baseline, candidate]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_MULTILEVEL_LOOKUP: '0'
      VARIANT: ${{ matrix.variant }}
      PAIR: ${{ matrix.pair }}
      SOURCE: ${{ github.workspace }}/source
      EVIDENCE: ${{ github.workspace }}/evidence
      LOCKS: ${{ github.workspace }}/locks
    steps:
      - name: Check out measurement harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out fixed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dfd1d4bab345abfe150ab56d8268479aaf56bcf2
          path: source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: fixed-nuget-locks
          path: locks
      - name: Set fresh private install and cache paths
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-runtime-benchmark'
          if (Test-Path $root) { throw 'Private benchmark root already exists' }
          New-Item -ItemType Directory $root | Out-Null
          "BENCH_ROOT=$root" >> $env:GITHUB_ENV
          "DOTNET_INSTALL_DIR=$root/dotnet" >> $env:GITHUB_ENV
          "DOTNET_CLI_HOME=$root/cli-home" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$root/nuget" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=$root/nuget-http" >> $env:GITHUB_ENV
          New-Item -ItemType Directory evidence | Out-Null
          git -C harness rev-parse HEAD > evidence/harness-commit.txt
      - name: cold setup baseline SDK8 and SDK10
        if: matrix.variant == 'baseline'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            8.0.426
            10.0.402
      - name: cold setup candidate SDK10
        if: matrix.variant == 'candidate'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
      - name: cold install candidate runtime8
        if: matrix.variant == 'candidate'
        shell: pwsh
        run: |
          $installer = Join-Path $env:BENCH_ROOT 'dotnet-install.ps1'
          Invoke-WebRequest 'https://raw.githubusercontent.com/dotnet/install-scripts/e5cf1dd2d1540ed05ac84f8eb8c5cdec2807621e/src/dotnet-install.ps1' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3bb07bc8025211836c1e4f9d3f6a044e55b1fb6eec518a6c78851d04e210442b') { throw 'Unexpected installer checksum' }
          & $installer -Runtime dotnet -Version '8.0.32' -InstallDir $env:DOTNET_INSTALL_DIR -Architecture x64 -NoPath -SkipNonVersionedFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: cold full checks and isolated local package consumer
        run: python harness/.github/benchmarks/windows-benchmark.py cold
      - name: warm setup baseline SDK8 and SDK10
        if: matrix.variant == 'baseline'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            8.0.426
            10.0.402
      - name: warm setup candidate SDK10
        if: matrix.variant == 'candidate'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
      - name: warm install candidate runtime8
        if: matrix.variant == 'candidate'
        shell: pwsh
        run: |
          $installer = Join-Path $env:BENCH_ROOT 'dotnet-install.ps1'
          Invoke-WebRequest 'https://raw.githubusercontent.com/dotnet/install-scripts/e5cf1dd2d1540ed05ac84f8eb8c5cdec2807621e/src/dotnet-install.ps1' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3bb07bc8025211836c1e4f9d3f6a044e55b1fb6eec518a6c78851d04e210442b') { throw 'Unexpected installer checksum' }
          & $installer -Runtime dotnet -Version '8.0.32' -InstallDir $env:DOTNET_INSTALL_DIR -Architecture x64 -NoPath -SkipNonVersionedFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: warm full checks and isolated local package consumer
        run: python harness/.github/benchmarks/windows-benchmark.py warm
      - name: Preserve complete results and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-runtime-${{ matrix.pair }}-${{ matrix.variant }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
