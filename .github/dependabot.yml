version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript-development:
        dependency-type: development
    ignore:
      # TypeScript 7 (the native compiler) drops the JS compiler API that
      # docs/scripts/check_typescript_api_docs.mjs and the typedoc toolchain
      # depend on. Revisit when typedoc supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    groups:
      java-development:
        dependency-type: development

  - package-ecosystem: nuget
    directory: /csharp
    schedule:
      interval: weekly
    groups:
      dotnet-development:
        # The library has no package dependencies; every NuGet reference is a test or tooling package.
        patterns: ["*"]
    ignore:
      # Roslyn 5 ships analyzers that need a newer compiler than the .NET 8 SDK has, so the
      # test project stops building on the oldest supported SDK (CS9057). The tests only use
      # Roslyn to compile C# 12 documentation snippets, which 4.x does. Revisit when .NET 8
      # support is dropped.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      # These tooling crates exchange syn AST values and must move together.
      rust-syntax-tools:
        patterns: ["syn", "prettyplease"]
      rust-development:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /rust/integrations
    schedule:
      interval: weekly
    groups:
      rust-sending-examples:
        patterns: ["*"]
    ignore:
      # wiremock 0.6.5 uses let chains (Rust 1.88+) without declaring an MSRV.
      # Keep the integration tests runnable on Rust 1.85; assess later releases separately.
      - dependency-name: wiremock
        versions: ["0.6.5"]

  - package-ecosystem: composer
    directory: /php
    schedule:
      interval: weekly
    groups:
      php-development:
        dependency-type: development
    ignore:
      # PHPUnit 12+ requires PHP 8.3+. Keep contributor tooling compatible with PHP 8.2.
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: /php/integrations
    schedule:
      interval: weekly
    groups:
      php-sending-examples:
        patterns: ["*"]
    ignore:
      # PHPUnit 12+ and Symfony 8 require a newer PHP than the supported 8.2 minimum.
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
      - dependency-name: symfony/http-client
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
