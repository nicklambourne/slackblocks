version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript-development:
        dependency-type: development
    ignore:
      # TypeScript 7 (the native compiler) drops the JS compiler API that
      # docs/scripts/check_typescript_api_docs.mjs and the typedoc toolchain
      # depend on. Revisit when typedoc supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    groups:
      java-development:
        dependency-type: development

  - package-ecosystem: nuget
    directory: /csharp
    schedule:
      interval: weekly
    groups:
      dotnet-development:
        # The library has no package dependencies; every NuGet reference is a test or tooling package.
        patterns: ["*"]
    ignore:
      # Roslyn 5 ships analyzers that need a newer compiler than the .NET 8 SDK has, so the
      # test project stops building on the oldest supported SDK (CS9057). The tests only use
      # Roslyn to compile C# 12 documentation snippets, which 4.x does. Revisit when .NET 8
      # support is dropped.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
