version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript-development:
        dependency-type: development
    ignore:
      # TypeScript 7 (the native compiler) drops the JS compiler API that
      # docs/scripts/check_typescript_api_docs.mjs and the typedoc toolchain
      # depend on. Revisit when typedoc supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
