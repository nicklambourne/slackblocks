packages:
  - docs
  - typescript

allowBuilds:
  core-js: true

# Installs are explicit and frozen in CI; package scripts must not rewrite the workspace.
verifyDepsBeforeRun: false

# Security floors for vulnerable transitive dependencies (GHSA alerts):
# serialize-javascript < 7.0.5 (XSS), uuid < 11.1.1 (insecure randomness).
overrides:
  serialize-javascript: ^7.0.5
  uuid: ^11.1.1
