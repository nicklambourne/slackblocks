[package]
name = "slackblocks-conformance"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
slackblocks = { path = ".." }
serde_json = "1.0.145"

syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
prettyplease = "0.3"

[features]
json-features = ["serde_json/arbitrary_precision", "serde_json/preserve_order"]

[dev-dependencies]
serde = "1.0.228"
proptest = { version = "=1.9.0", default-features = false, features = ["std"] }
