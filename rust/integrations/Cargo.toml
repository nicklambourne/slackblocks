[package]
name = "slackblocks-sending-examples"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Application dependencies have their own resolution and never enter the core crate.
[workspace]
resolver = "3"

[dependencies]
slackblocks = { path = ".." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.13.5", features = ["json"] }
slack-morphism = { version = "2.29.0", features = ["hyper"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
# Newer wiremock uses let chains without declaring its Rust 1.88 requirement.
wiremock = "=0.6.2"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
