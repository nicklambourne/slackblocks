[package]
name = "slackblocks"
version = "2.6.0"
edition = "2024"
rust-version = "1.85"
description = "Native, validated Rust builders for Slack Block Kit"
license = "MIT OR BSD-3-Clause"
repository = "https://github.com/nicklambourne/slackblocks"
homepage = "https://nicklambourne.github.io/slackblocks/"
documentation = "https://docs.rs/slackblocks"
readme = "README.md"
keywords = ["slack", "block-kit", "builder", "serde"]
categories = ["api-bindings", "encoding"]
publish = false
include = ["src/**", "examples/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE.BSD-3-Clause", "Cargo.toml", "Cargo.lock"]

# Activation is a separately reviewed release-readiness change. No token fallback.
[package.metadata.slackblocks-release]
authentication = "bootstrap"
bootstrap-version = "2.6.0"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }

[workspace]
members = [".", "conformance"]
resolver = "3"
